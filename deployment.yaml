apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-flask
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-flask
  template:
    metadata:
      labels:
        app: sample-flask
    spec:
      containers:
        - name: sample-flask
          image: RRR/rrr:ttt
          ports:
            - containerPort: 5000
          env:
            - name: APP_ENV
              value: development
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sample-flask
spec:
  selector:
    app: sample-flask
  ports:
    - port: 80
      targetPort: 5000
  type: ClusterIP
